name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -trimpath

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.6.0'
      - name: Verify modules
        run: |
          go mod tidy -diff
          go mod verify
      - name: Install pinned check tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install mvdan.cc/gofumpt@v0.12.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: Static checks
        run: |
          go vet ./...
          modern_diff="$(go fix -diff ./...)"
          if [ -n "$modern_diff" ]; then
            printf '%s\n' "$modern_diff"
            exit 1
          fi
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          golangci-lint run ./...
      - name: Build and test
        run: |
          go build ./...
          go test -vet=off -race -count=1 -timeout=5m -covermode=atomic -coverprofile=coverage.out ./...
          node --test examples/unicloud/univerify/index.test.js
      - name: Require coverage of at least 80 percent
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ { seen=1; sub(/%$/, "", $3); print "Coverage: " $3 "%"; if ($3+0 < 80) exit 1 } END { if (!seen) exit 1 }'
      - name: Benchmark
        run: go test -vet=off -run='^$' -bench=. -benchmem -count=3 ./...
      - name: Security checks
        run: |
          govulncheck ./...
          gosec -quiet ./...
